<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Боруссия — статистика</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
    }
    header {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(128,128,128,0.25);
    }
    .menu-btn {
      border: none; background: transparent; color: inherit;
      font-size: 22px; cursor: pointer; padding: 4px 8px;
    }
    .logo { width: 36px; height: 36px; object-fit: contain; }
    h1 { font-size: 18px; margin: 0; }

    /* Боковое меню */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .overlay.open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed; top: 0; left: 0; bottom: 0; width: 240px; max-width: 80%;
      background: var(--tg-theme-secondary-bg-color, #f4f4f5);
      transform: translateX(-100%); transition: transform 0.2s;
      padding: 16px; z-index: 10;
    }
    .drawer.open { transform: translateX(0); }
    .drawer h2 { font-size: 16px; margin: 0 0 12px; }
    .drawer button {
      display: block; width: 100%; text-align: left;
      border: none; background: transparent; color: inherit;
      font-size: 16px; padding: 12px 8px; border-radius: 8px; cursor: pointer;
    }
    .drawer button.active { background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); }

    main { padding: 16px; }
    section[hidden] { display: none; }

    .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .tabs button {
      border: 1px solid var(--tg-theme-hint-color, #888);
      background: transparent; color: inherit;
      border-radius: 14px; padding: 6px 10px; font-size: 13px; cursor: pointer;
    }
    .tabs button.active {
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
      border-color: transparent;
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 4px; border-bottom: 1px solid rgba(128,128,128,0.25); }
    th.num, td.num { text-align: right; width: 56px; }
    .empty { opacity: 0.6; font-size: 14px; padding: 12px 0; }

    /* Состав */
    .squad { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
    .card { text-align: center; font-size: 13px; }
    .card img, .card .placeholder {
      width: 100%; aspect-ratio: 1 / 1; object-fit: cover;
      border-radius: 10px; background: rgba(128,128,128,0.15);
    }
    .card .placeholder { display: flex; align-items: center; justify-content: center; }
    .card .placeholder svg { width: 60%; height: 60%; fill: rgba(128,128,128,0.5); }
    .card .name { margin-top: 6px; }
    .achievements { padding-left: 20px; font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <header>
    <button class="menu-btn" id="menuBtn" aria-label="Меню">☰</button>
    <img class="logo" src="emblem.svg" alt="Эмблема">
    <h1 id="team">Боруссия</h1>
  </header>

  <div class="overlay" id="overlay"></div>
  <nav class="drawer" id="drawer">
    <h2>Разделы</h2>
    <button data-section="stats" class="active">Статистика</button>
    <button data-section="achievements">Достижения</button>
    <button data-section="squad">Состав</button>
  </nav>

  <main>
    <section id="stats">
      <div class="tabs">
        <button data-key="goals" class="active">Голы</button>
        <button data-key="assists">Ассисты</button>
        <button data-key="motm">Лучший игрок матча</button>
        <button data-key="squad_of_week">Сборная тура</button>
      </div>
      <div id="statsContent" class="empty">Загрузка данных…</div>
    </section>

    <section id="achievements" hidden>
      <div id="achievementsContent" class="empty">Загрузка данных…</div>
    </section>

    <section id="squad" hidden>
      <div id="squadContent" class="empty">Загрузка данных…</div>
    </section>
  </main>

  <script>
    const LABELS = {
      goals: "Голы",
      assists: "Ассисты",
      motm: "Лучший игрок матча",
      squad_of_week: "Сборная тура"
    };
    const PLACEHOLDER_SVG =
      '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.5"/><path d="M3 22c0-5 4-8 9-8s9 3 9 8z"/></svg>';

    let data = null;
    let currentKey = "goals";

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function fullName(p) {
      return p.surname + " " + p.name;
    }

    /* Статистика: по убыванию, игроки с нулём скрыты */
    function renderStats() {
      const el = document.getElementById("statsContent");
      if (!data || !Array.isArray(data.players)) {
        el.className = "empty";
        el.textContent = "Не удалось загрузить данные.";
        return;
      }
      const rows = data.players
        .map(p => ({ name: fullName(p), value: Number(p[currentKey]) || 0 }))
        .filter(r => r.value > 0)
        .sort((a, b) => b.value - a.value || a.name.localeCompare(b.name, "ru"));

      if (rows.length === 0) {
        el.className = "empty";
        el.textContent = "Пока нет данных: «" + LABELS[currentKey] + "».";
        return;
      }
      el.className = "";
      el.innerHTML =
        "<table><thead><tr><th>Игрок</th><th class='num'>" + escapeHtml(LABELS[currentKey]) + "</th></tr></thead><tbody>" +
        rows.map(r => "<tr><td>" + escapeHtml(r.name) + "</td><td class='num'>" + r.value + "</td></tr>").join("") +
        "</tbody></table>";
    }

    /* Достижения: список из data.json, пока пустой */
    function renderAchievements() {
      const el = document.getElementById("achievementsContent");
      const list = data && Array.isArray(data.achievements) ? data.achievements : [];
      if (list.length === 0) {
        el.className = "empty";
        el.textContent = "Пока нет достижений.";
        return;
      }
      el.className = "";
      el.innerHTML = "<ul class='achievements'>" +
        list.map(a => "<li>" + escapeHtml(a) + "</li>").join("") + "</ul>";
    }

    /* Состав: по алфавиту, без статистики, все игроки */
    function renderSquad() {
      const el = document.getElementById("squadContent");
      if (!data || !Array.isArray(data.players)) {
        el.className = "empty";
        el.textContent = "Не удалось загрузить данные.";
        return;
      }
      const players = data.players.slice().sort((a, b) =>
        a.surname.localeCompare(b.surname, "ru") || a.name.localeCompare(b.name, "ru"));

      el.className = "squad";
      el.innerHTML = players.map(p => {
        const img = p.photo
          ? "<img src='photos/" + escapeHtml(p.photo) + "' alt='" + escapeHtml(fullName(p)) + "'>"
          : "<div class='placeholder'>" + PLACEHOLDER_SVG + "</div>";
        return "<div class='card'>" + img + "<div class='name'>" + escapeHtml(fullName(p)) + "</div></div>";
      }).join("");
    }

    /* Переключение разделов через боковое меню */
    const drawer = document.getElementById("drawer");
    const overlay = document.getElementById("overlay");
    function toggleMenu(open) {
      drawer.classList.toggle("open", open);
      overlay.classList.toggle("open", open);
    }
    document.getElementById("menuBtn").addEventListener("click", () => toggleMenu(!drawer.classList.contains("open")));
    overlay.addEventListener("click", () => toggleMenu(false));

    document.querySelectorAll("[data-section]").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("[data-section]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        ["stats", "achievements", "squad"].forEach(id => {
          document.getElementById(id).hidden = id !== btn.dataset.section;
        });
        toggleMenu(false);
      });
    });

    /* Вкладки статистики */
    document.querySelectorAll(".tabs button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentKey = btn.dataset.key;
        renderStats();
      });
    });

    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    fetch("data.json", { cache: "no-store" })
      .then(r => r.json())
      .then(json => {
        data = json;
        if (json.team) document.getElementById("team").textContent = json.team;
      })
      .catch(() => { data = null; })
      .finally(() => {
        renderStats();
        renderAchievements();
        renderSquad();
      });
  </script>
</body>
</html>
